name: Deploy Web via SSH

on:
  push:
    branches:
      - elsapaghv2
  workflow_dispatch:

concurrency:
  group: deploy-flutter-web
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    env:
      SERVER_HOST: 162.254.39.31
      SERVER_USER: octopusteam
      SERVER_PORT: 21098
      SERVER_SSH_KEY: |
        -----BEGIN OPENSSH PRIVATE KEY-----
        b3BlbnNzaC1rZXktdjEAAAAABG5vbmUAAAAEbm9uZQAAAAAAAAABAAAAMwAAAAtzc2gtZW
        QyNTUxOQAAACBOqxQlLXGCTt2s7JNT0oIToVMfrlbmInC943mFd6st7wAAAJhkGrLLZBqy
        ywAAAAtzc2gtZWQyNTUxOQAAACBOqxQlLXGCTt2s7JNT0oIToVMfrlbmInC943mFd6st7w
        AAAEDPSJgUswTzqIVDVFIExSA3t0h638mGb6D51HjVDMHqME6rFCUtcYJO3azsk1PSghOh
        Ux+uVuYicL3jeYV3qy3vAAAAFWdpdGh1Yi1hY3Rpb25zLWRlcGxveQ==
        -----END OPENSSH PRIVATE KEY-----
      PROJECT_PATH: /home/octopusteam/elsapagh.octopusteam.net
      RELEASE_PATH: /home/octopusteam/releases/elsapagh

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Install dependencies
        run: flutter pub get

      - name: Build web release
        run: flutter build web --release

      - name: Upload build/web to release path
        uses: appleboy/scp-action@v0.1.7
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          source: "build/web/*"
          target: ${{ env.RELEASE_PATH }}

      - name: Publish release on server
        uses: appleboy/ssh-action@v1.2.0
        with:
          host: ${{ env.SERVER_HOST }}
          username: ${{ env.SERVER_USER }}
          key: ${{ env.SERVER_SSH_KEY }}
          port: ${{ env.SERVER_PORT }}
          envs: PROJECT_PATH,RELEASE_PATH
          script: |
            set -e
            mkdir -p "${PROJECT_PATH}"
            rm -rf "${PROJECT_PATH}"/*
            if [ -d "${RELEASE_PATH}/build/web" ]; then
              cp -a "${RELEASE_PATH}/build/web/." "${PROJECT_PATH}/"
            else
              cp -a "${RELEASE_PATH}/." "${PROJECT_PATH}/"
            fi
